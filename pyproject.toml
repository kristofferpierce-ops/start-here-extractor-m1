[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "start-here-extractor"
version = "0.6.1"
description = "Inspect-first, extract-minimally ZIP START HERE extractor"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OpenAI for user deliverable"}]
license = {text = "Proprietary / user project"}
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.0.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
start-here-extractor = "start_here_extractor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
