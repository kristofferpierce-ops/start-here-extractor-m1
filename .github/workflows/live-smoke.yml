name: live-provider-smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud provider
        required: true
        type: choice
        options:
          - gdrive
          - dropbox
          - graph
      query:
        description: Search query
        required: true
        default: drive_smoke_test
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .[dev]

      - name: Resolve provider token
        id: token
        shell: bash
        env:
          GDRIVE_ACCESS_TOKEN: ${{ secrets.GDRIVE_ACCESS_TOKEN }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          GRAPH_ACCESS_TOKEN: ${{ secrets.GRAPH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          case "${{ inputs.provider }}" in
            gdrive)
              TOKEN="${GDRIVE_ACCESS_TOKEN:-}"
              ;;
            dropbox)
              TOKEN="${DROPBOX_ACCESS_TOKEN:-}"
              ;;
            graph)
              TOKEN="${GRAPH_ACCESS_TOKEN:-}"
              ;;
            *)
              echo "Unsupported provider: ${{ inputs.provider }}" >&2
              exit 1
              ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "Missing token secret for provider ${{ inputs.provider }}" >&2
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run live provider smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m start_here_extractor.cli \
            --cloud-provider "${{ inputs.provider }}" \
            --cloud-access-token "${{ steps.token.outputs.token }}" \
            --cloud-query "${{ inputs.query }}" \
            --output-dir ./out/remote_extracted \
            --report-dir ./out/remote_reports

      - name: Show smoke outputs
        shell: bash
        run: |
          set -euo pipefail
          find ./out -maxdepth 3 -type f | sort || true
          REPORT="$(find ./out/remote_reports -name '*.inventory.jsonl' | head -n 1 || true)"
          if [ -n "${REPORT:-}" ]; then
            echo "Inventory:"
            cat "$REPORT"
          fi

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v6
        with:
          name: live-smoke-${{ inputs.provider }}
          path: out/
          if-no-files-found: error
