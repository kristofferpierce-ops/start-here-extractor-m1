name: live-provider-smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud provider to smoke test
        required: true
        type: choice
        options:
          - gdrive
          - dropbox
          - graph
      query:
        description: Query string used to find the remote ZIP
        required: true
        default: drive_smoke_test

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Resolve provider token
        id: token
        shell: bash
        env:
          GDRIVE_ACCESS_TOKEN: ${{ secrets.GDRIVE_ACCESS_TOKEN }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          GRAPH_ACCESS_TOKEN: ${{ secrets.GRAPH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ inputs.provider }}" in
            gdrive)
              TOKEN="${GDRIVE_ACCESS_TOKEN:-}"
              ;;
            dropbox)
              TOKEN="${DROPBOX_ACCESS_TOKEN:-}"
              ;;
            graph)
              TOKEN="${GRAPH_ACCESS_TOKEN:-}"
              ;;
            *)
              echo "Unsupported provider: ${{ inputs.provider }}" >&2
              exit 1
              ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "Missing token secret for provider ${{ inputs.provider }}" >&2
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run live provider smoke test
        shell: bash
        run: |
          set -euo pipefail
          python -m start_here_extractor.cli             --cloud-provider "${{ inputs.provider }}"             --cloud-access-token "${{ steps.token.outputs.token }}"             --cloud-query "${{ inputs.query }}"             --output-dir ./out/remote_extracted             --report-dir ./out/remote_reports

      - name: Show smoke outputs
        shell: bash
        run: |
          set -euo pipefail
          find ./out -maxdepth 3 -type f | sort
          REPORT="$(find ./out/remote_reports -name '*.inventory.jsonl' | head -n 1)"
          if [ -n "$REPORT" ]; then
            echo "Inventory:"
            cat "$REPORT"
          fi

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ inputs.provider }}
          path: out/
