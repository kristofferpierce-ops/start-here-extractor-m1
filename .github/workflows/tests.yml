name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: pytest

      - name: Schema validation
        run: python scripts/validate_inventory.py examples/sample_inventory_extracted.jsonl

      - name: Windows sandbox dry-run smoke
        if: runner.os == 'Windows' && matrix.python-version == '3.12'
        run: python scripts/ci_sandbox_dry_run.py
